<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Capture</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;--card:#fff;--border:#e0ddd6;
  --text:#1a1a1a;--muted:#6b6860;--accent:#e8571a;--ah:#c94a14;
  --teal:#0f6e56;--success:#1d9e75;--amber:#ba7517;--purple:#534ab7;
  --tag:#f0ede6;--sw:280px
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}

/* HEADER */
.hd{background:var(--card);border-bottom:1px solid var(--border);padding:11px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.logo{font-size:15px;font-weight:600;color:var(--accent);cursor:pointer}
.hd-r{display:flex;gap:8px}
.bsm{background:none;border:1px solid var(--border);border-radius:7px;padding:5px 12px;font-size:13px;color:var(--muted);cursor:pointer}
.bsm:hover{border-color:var(--accent);color:var(--accent)}

/* LAYOUT */
.layout{display:flex;height:calc(100vh - 48px)}

/* SIDEBAR */
.sb{width:var(--sw);border-right:1px solid var(--border);background:var(--card);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sb-hd{padding:13px 15px 9px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.sb-cnt{flex:1;overflow-y:auto;padding:8px}
.qi{border-radius:8px;padding:9px 11px;margin-bottom:5px;cursor:pointer;border:1.5px solid transparent;background:var(--bg)}
.qi:hover{border-color:var(--border)}
.qi.active{border-color:var(--accent);background:#fdf2ec}
.qi.done{opacity:.5}
.qi-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.qi-st{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.da{background:var(--amber);animation:pulse 1s infinite}
.dp{background:var(--accent)}
.dd{background:var(--success)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.q-empty{text-align:center;padding:36px 14px;font-size:13px;color:var(--muted);line-height:1.7}

/* MAIN */
.ma{flex:1;overflow-y:auto;padding:18px}

/* INPUT CARD */
.ic{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.src-tags{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap}
.tag{border:1.5px solid var(--border);border-radius:20px;padding:4px 11px;font-size:13px;color:var(--muted);cursor:pointer;background:var(--card)}
.tag.active{border-color:var(--accent);color:var(--accent);background:#fdf2ec;font-weight:600}
.ia{width:100%;min-height:88px;border:1.5px solid var(--border);border-radius:10px;padding:11px;font-size:14px;font-family:inherit;color:var(--text);background:var(--bg);resize:vertical;outline:none;line-height:1.6}
.ia:focus{border-color:var(--accent);background:#fff}
.ia::placeholder{color:#bbb}
.if{display:flex;justify-content:space-between;align-items:center;margin-top:9px}
.ch{font-size:12px;color:var(--muted)}
.ban{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer}
.ban:hover{background:var(--ah)}
.ban:disabled{background:#ccc;cursor:not-allowed}

/* REVIEW CARD */
.rc{background:var(--card);border:1.5px solid var(--success);border-radius:12px;padding:18px;margin-bottom:14px}
.rc-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.rc-label{font-size:13px;font-weight:600;color:var(--success)}
.conf{font-size:12px;color:var(--muted);background:var(--tag);padding:3px 9px;border-radius:20px}

/* PATH */
.path{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:8px 11px;background:var(--tag);border-radius:8px;margin-bottom:11px}
.pi{font-size:13px;font-weight:500}
.ps{font-size:13px;color:var(--muted)}
.pf{font-size:13px;font-weight:600;color:var(--accent)}

.reason{background:#f9f8f5;border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:8px 11px;margin-bottom:12px;font-size:13px;color:var(--muted);line-height:1.6}

/* FIELDS */
.fl{margin-bottom:11px}
.fl-lb{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.fv{font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 11px;width:100%;outline:none}
.fv:focus{border-color:var(--accent);background:#fff}
input[type=date].fv{font-family:inherit}

/* TREE */
.tree-toggle{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;color:var(--accent);margin-bottom:9px;user-select:none}
.tree-toggle:hover{text-decoration:underline}
.tree-wrap{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:13px}

/* Layer 1: plans */
.plans-row{display:flex;flex-wrap:wrap;gap:6px;padding:11px;background:var(--tag);border-bottom:1px solid var(--border)}
.plan-pill{border:1.5px solid var(--border);border-radius:20px;padding:4px 11px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;background:var(--card);white-space:nowrap;transition:all .1s}
.plan-pill:hover{border-color:var(--accent);color:var(--accent)}
.plan-pill.sel{border-color:var(--accent);color:var(--accent);background:#fdf2ec}

/* Layer 2: projects */
.projs-area{padding:9px 11px;background:#faf9f6;border-bottom:1px solid var(--border);display:none}
.projs-area.show{display:block}
.projs-row{display:flex;flex-wrap:wrap;gap:6px}
.proj-chip{border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--muted);cursor:pointer;background:var(--card);display:flex;align-items:center;gap:4px;transition:all .1s}
.proj-chip:hover{border-color:var(--accent);color:var(--text)}
.proj-chip.open{border-color:var(--accent);color:var(--accent);background:#fdf2ec;font-weight:600}
.chip-arr{font-size:9px;transition:transform .15s}
.proj-chip.open .chip-arr{transform:rotate(90deg)}

/* Layer 3: checkpoints */
.cp-area{padding:0 11px 10px;display:none}
.cp-area.show{display:block}
.cp-lbl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:8px 0 6px}
.cp-grid{display:flex;flex-wrap:wrap;gap:5px}
.cp-item{border:1px solid var(--border);border-radius:6px;padding:4px 9px;font-size:12px;color:var(--text);cursor:pointer;background:var(--card);transition:all .1s}
.cp-item:hover{border-color:var(--accent);color:var(--accent);background:#fdf2ec}
.cp-item.sel{border-color:var(--accent);color:var(--accent);background:#fdf2ec;font-weight:600}

/* ACTIONS */
.acts{display:flex;gap:9px;margin-top:14px}
.bsubmit{flex:1;background:var(--success);color:#fff;border:none;border-radius:8px;padding:10px;font-size:14px;font-weight:600;cursor:pointer}
.bsubmit:hover{background:#0a8a63}
.bsubmit:disabled{background:#ccc;cursor:not-allowed}
.bskip{background:none;border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:13px;color:var(--muted);cursor:pointer}
.bskip:hover{border-color:#aaa}

/* STATUS */
.smsg{text-align:center;padding:13px;font-size:14px;border-radius:10px;margin-bottom:13px}
.smsg.ok{background:#e6f7f1;color:var(--success);border:1px solid #9fe1cb}
.smsg.err{background:#fce8e8;color:#a32d2d;border:1px solid #f09595}
.smsg.loading{background:var(--tag);color:var(--muted)}

/* SETTINGS / HISTORY */
.pg{padding:18px;max-width:520px}
.pgc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px}
.pgt{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}
.pgf{margin-bottom:14px}
.pgl{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
.pgh{font-size:12px;color:var(--muted);margin-bottom:5px;line-height:1.5}
.pgi{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:13px;font-family:monospace;color:var(--text);background:var(--bg);outline:none}
.pgi:focus{border-color:var(--accent);background:#fff}
.bsave{background:var(--purple);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:13px;font-weight:600;cursor:pointer;margin-right:7px}
.bsync{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
.sync-st{margin-top:9px;font-size:13px;color:var(--muted)}

.hi{padding:10px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:11px}
.hi:last-child{border-bottom:none}
.hn{font-size:14px;color:var(--text)}
.hp{font-size:12px;color:var(--accent);margin-top:2px}
.hm{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
.empty{text-align:center;padding:36px 18px;font-size:13px;color:var(--muted)}

/* SPINNER */
.sp{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}

/* SETUP */
.setup{background:#fdf2ec;border:1.5px solid var(--accent);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.setup-t{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:4px}
.setup-b{font-size:13px;color:var(--text);line-height:1.6}

@media(max-width:600px){
  :root{--sw:220px}
  .layout{flex-direction:column;height:auto}
  .sb{width:100%;height:150px;border-right:none;border-bottom:1px solid var(--border)}
}
</style>
</head>
<body>

<div class="hd">
  <div class="logo" onclick="gomain()">⚡ AI Capture</div>
  <div class="hd-r">
    <button class="bsm" onclick="gopage('history')">記錄</button>
    <button class="bsm" onclick="gopage('settings')">設定</button>
  </div>
</div>

<!-- MAIN VIEW -->
<div id="view-main" class="layout">
  <div class="sb">
    <div class="sb-hd">
      <span>待處理佇列</span>
      <span id="qcount" style="font-size:12px;color:var(--muted)">0 筆</span>
    </div>
    <div class="sb-cnt" id="qlist">
      <div class="q-empty">貼入訊息後<br>會出現在這裡</div>
    </div>
  </div>
  <div class="ma" id="main-area">
    <div class="setup" id="setup-notice" style="display:none">
      <div class="setup-t">⚙️ 請先完成設定</div>
      <div class="setup-b">點右上角「設定」，填入 Notion Token 與 Claude API Key，然後同步資料庫。</div>
    </div>
    <div class="ic">
      <div class="src-tags">
        <div class="tag active" onclick="setSrc(this,'Outlook')">📧 Outlook</div>
        <div class="tag" onclick="setSrc(this,'Line')">💬 Line</div>
        <div class="tag" onclick="setSrc(this,'會議')">🗓 會議</div>
        <div class="tag" onclick="setSrc(this,'其他')">✏️ 其他</div>
      </div>
      <textarea class="ia" id="txt" placeholder="把 Outlook 信件、Line 訊息貼在這裡..." oninput="onInput()"></textarea>
      <div class="if">
        <span class="ch" id="cc">0 字</span>
        <button class="ban" onclick="doAnalyze()">🔍 AI 分析</button>
      </div>
    </div>
    <div id="rev-area"></div>
  </div>
</div>

<!-- SETTINGS -->
<div id="view-settings" style="display:none">
  <div class="pg">
    <div class="pgc">
      <div class="pgt">設定</div>
      <div class="pgf">
        <div class="pgl">Notion API Token</div>
        <div class="pgh">ANTIGRAVITY Integration Token（secret_... 開頭）</div>
        <input class="pgi" type="password" id="ntoken" placeholder="secret_...">
      </div>
      <div class="pgf">
        <div class="pgl">Claude API Key</div>
        <div class="pgh">Anthropic API Key（sk-ant-... 開頭）</div>
        <input class="pgi" type="password" id="ckey" placeholder="sk-ant-...">
      </div>
      <button class="bsave" onclick="saveCfg()">💾 儲存</button>
      <button class="bsync" onclick="doSync()">🔄 同步 Notion</button>
      <div class="sync-st" id="syncst"></div>
    </div>
    <div class="pgc" id="syncinfo" style="display:none">
      <div class="pgt">已同步資料</div>
      <div id="syncinfo-body" style="font-size:13px;color:var(--muted);line-height:1.9"></div>
    </div>
  </div>
</div>

<!-- HISTORY -->
<div id="view-history" style="display:none">
  <div class="pg">
    <div class="pgc">
      <div class="pgt">最近建立記錄</div>
      <div id="hlist"><div class="empty">還沒有記錄</div></div>
    </div>
  </div>
</div>

<script>
var PROXY = 'https://notion-proxy.tca-hsuoo.workers.dev/notion';
var DBS = {
  plan:'2039cedd371d8092b7f3c222f43778c4',
  project:'2039cedd371d800f9271c3a9c7610eb8',
  checkpoint:'2039cedd371d80798955effa678aafe1',
  todo:'2039cedd371d8010ae84f60c29f86990'
};

var src = 'Outlook';
var cache = null;
var queue = [];
var activeId = null;

// INIT
window.onload = function() {
  var t = ls('notion_token'), k = ls('claude_key');
  var n = document.getElementById('ntoken'), c = document.getElementById('ckey');
  if (n && t) n.value = t;
  if (c && k) c.value = k;
  if (!t || !k) document.getElementById('setup-notice').style.display = 'block';
  var cv = ls('notion_cache');
  if (cv) { cache = JSON.parse(cv); showSyncInfo(); }
};

function ls(k, v) {
  if (v !== undefined) { localStorage.setItem(k, v); return; }
  return localStorage.getItem(k);
}

// VIEWS
function gomain() {
  document.getElementById('view-main').style.display = 'flex';
  document.getElementById('view-settings').style.display = 'none';
  document.getElementById('view-history').style.display = 'none';
}
function gopage(p) {
  document.getElementById('view-main').style.display = 'none';
  document.getElementById('view-settings').style.display = p === 'settings' ? 'block' : 'none';
  document.getElementById('view-history').style.display = p === 'history' ? 'block' : 'none';
  if (p === 'history') renderHistory();
}

// INPUT
function setSrc(el, s) {
  document.querySelectorAll('.src-tags .tag').forEach(function(t) { t.classList.remove('active'); });
  el.classList.add('active');
  src = s;
}
function onInput() {
  var v = document.getElementById('txt').value;
  document.getElementById('cc').textContent = v.length + ' 字';
}

// QUEUE RENDER
function renderQueue() {
  var el = document.getElementById('qlist');
  var cnt = document.getElementById('qcount');
  var pending = queue.filter(function(q) { return q.status !== 'done' && q.status !== 'skipped'; }).length;
  cnt.textContent = pending + ' 筆';
  if (queue.length === 0) { el.innerHTML = '<div class="q-empty">貼入訊息後<br>會出現在這裡</div>'; return; }
  var stMap = { analyzing:'分析中', pending:'待審核', done:'已完成', skipped:'已略過' };
  var dotMap = { analyzing:'da', pending:'dp', done:'dd', skipped:'' };
  el.innerHTML = queue.map(function(item) {
    var isActive = item.id === activeId ? ' active' : '';
    var isDone = (item.status === 'done' || item.status === 'skipped') ? ' done' : '';
    var extra = item.status === 'pending' ? ' · 等待確認' : '';
    return '<div class="qi' + isActive + isDone + '" onclick="selectQ(\'' + item.id + '\')">'
      + '<div class="qi-name">' + item.text.substring(0,38) + (item.text.length > 38 ? '...' : '') + '</div>'
      + '<div class="qi-st"><span class="dot ' + (dotMap[item.status] || '') + '"></span>' + (stMap[item.status] || '') + extra + '</div>'
      + '</div>';
  }).join('');
}

function selectQ(id) {
  activeId = id;
  renderQueue();
  var item = queue.filter(function(q) { return q.id === id; })[0];
  if (!item) return;
  if (item.status === 'pending') renderReview(item);
  else if (item.status === 'done' || item.status === 'skipped') {
    document.getElementById('rev-area').innerHTML = '<div class="smsg ok">已' + (item.status === 'done' ? '寫入' : '略過') + '：' + item.text.substring(0,30) + '</div>';
  }
}

// ANALYZE
function doAnalyze() {
  var text = document.getElementById('txt').value.trim();
  if (!text) { alert('請先輸入內容'); return; }
  var ckey = ls('claude_key');
  if (!ckey) { alert('請先在設定中填入 Claude API Key'); return; }
  if (!cache) { alert('請先同步 Notion 資料庫'); return; }

  var id = 'q' + Date.now();
  var item = { id: id, text: text, source: src, status: 'analyzing', result: null, selCP: null, selProj: null, selPlan: null };
  queue.unshift(item);
  activeId = id;
  renderQueue();
  document.getElementById('txt').value = '';
  document.getElementById('cc').textContent = '0 字';
  document.getElementById('rev-area').innerHTML = '<div class="smsg loading"><span class="sp"></span>AI 分析中...</div>';

  callClaude(text, src, ckey)
    .then(function(result) {
      item.result = result;
      item.status = 'pending';
      item.selCP = result.checkpoint || null;
      item.selProj = result.project || null;
      item.selPlan = result.plan || null;
      renderQueue();
      renderReview(item);
    })
    .catch(function(e) {
      item.status = 'skipped';
      renderQueue();
      document.getElementById('rev-area').innerHTML = '<div class="smsg err">❌ 分析失敗：' + e.message + '</div>';
    });
}

// CLAUDE API
function callClaude(text, source, ckey) {
  var ctx = buildCtx();
  var prompt = buildPrompt(text, source, ctx);
  return fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': ckey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 1000, messages: [{ role: 'user', content: prompt }] })
  })
  .then(function(res) {
    if (!res.ok) return res.json().then(function(e) { throw new Error(e.error && e.error.message ? e.error.message : 'Claude API 錯誤'); });
    return res.json();
  })
  .then(function(data) {
    var raw = data.content[0].text;
    var clean = raw.replace(/```json|```/g, '').trim();
    return JSON.parse(clean);
  });
}

function buildCtx() {
  if (!cache) return {};
  return {
    plans: cache.plans.map(function(p) { return { id: p.id, name: p.name }; }),
    projects: cache.projects.map(function(p) { return { id: p.id, name: p.name, planIds: p.planIds || [] }; }),
    checkpoints: cache.checkpoints.map(function(c) { return { id: c.id, name: c.name, projectIds: c.projectIds || [] }; })
  };
}

function buildPrompt(text, source, ctx) {
  var today = new Date();
  var weekdays = ['日','一','二','三','四','五','六'];
  var todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  var todayWeekday = '週' + weekdays[today.getDay()];
  return '你是 Notion 待辦事項建立助手。根據輸入內容，判斷應建立哪個待辦事項並對應到正確的查核點。\n\n'
    + '## 今天的日期\n今天是 ' + todayStr + '（' + todayWeekday + '）。請根據此日期推算「這週X」、「下週X」、「明天」等相對日期。doOn 請輸出 YYYY-MM-DD 格式。\n\n'
    + '## Notion 結構\n計劃：' + JSON.stringify(ctx.plans) + '\n'
    + '專案（含所屬計劃ID）：' + JSON.stringify(ctx.projects) + '\n'
    + '查核點（含所屬專案ID）：' + JSON.stringify(ctx.checkpoints) + '\n\n'
    + '## 使用者輸入\n來源：' + source + '\n內容：' + text + '\n\n'
    + '## TODO 命名規則（嚴格遵守）\n'
    + '1. 必須以動詞開頭：回覆、確認、追蹤、提交、製作、校閱、撰寫、通知、聯繫、整理、準備、安排、修改、提供、完稿、請款、填寫\n'
    + '2. 特殊符號前綴：⛔=會議類、⚠️=重要提交截止、❗=緊急確認、🆘=非常緊急、📞=電話聯繫、🚩=里程碑\n'
    + '3. 格式：符號＋動詞：對象或事項（例如「⚠️提交：小八確認 Q2業績簡報」）\n\n'
    + '## 回傳格式（純 JSON，不要其他文字）\n'
    + '{"name":"待辦名稱","doOn":"YYYY-MM-DD 或 null","checkpoint":{"id":"notion_id","name":"查核點名稱"},"project":{"id":"notion_id","name":"專案名稱"},"plan":{"id":"notion_id","name":"計劃名稱"},"reason":"判斷理由20字以內","confidence":"high/medium/low"}';
}

// RENDER REVIEW
function renderReview(item) {
  if (!item.result) return;
  var r = item.result;
  var confColor = r.confidence === 'high' ? 'var(--success)' : r.confidence === 'medium' ? 'var(--amber)' : '#a32d2d';
  var confText = r.confidence === 'high' ? '高信心' : r.confidence === 'medium' ? '中信心' : '低信心';
  var planName = (item.selPlan && item.selPlan.name) || '未知計劃';
  var projName = (item.selProj && item.selProj.name) || '未知專案';
  var cpName = (item.selCP && item.selCP.name) || '未指定查核點';
  var dateVal = r.doOn || '';

  document.getElementById('rev-area').innerHTML =
    '<div class="rc" id="rc_' + item.id + '">'
    + '<div class="rc-hd"><div class="rc-label">📌 待審核</div><div class="conf" style="color:' + confColor + '">' + confText + '</div></div>'
    + '<div class="path" id="path_' + item.id + '">'
    + '<span class="pi">' + esc(planName) + '</span><span class="ps">›</span>'
    + '<span class="pi">' + esc(projName) + '</span><span class="ps">›</span>'
    + '<span class="pf">' + esc(cpName) + '</span></div>'
    + '<div class="reason">' + esc(r.reason || '') + '</div>'
    + '<div class="fl"><div class="fl-lb">待辦名稱</div>'
    + '<div class="fv" id="tname_' + item.id + '" contenteditable="true">' + esc(r.name) + '</div></div>'
    + '<div class="fl"><div class="fl-lb">截止日期</div>'
    + '<input type="date" class="fv" id="tdate_' + item.id + '" value="' + dateVal + '"></div>'
    + '<div class="tree-toggle" id="ttoggle_' + item.id + '" onclick="toggleTree(\'' + item.id + '\')">'
    + '<span id="tarrow_' + item.id + '">▶</span> 手動選擇查核點</div>'
    + '<div id="treepanel_' + item.id + '" style="display:none">' + buildTree(item) + '</div>'
    + '<div class="acts">'
    + '<button class="bsubmit" id="bsub_' + item.id + '" onclick="doSubmit(\'' + item.id + '\')">✅ 確認寫入 Notion</button>'
    + '<button class="bskip" onclick="doSkip(\'' + item.id + '\')">略過</button></div>'
    + '<div id="subst_' + item.id + '"></div>'
    + '</div>';
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// TREE BUILDER
function buildTree(item) {
  if (!cache) return '<div style="padding:11px;font-size:13px;color:var(--muted)">尚未同步資料</div>';
  var iid = safeId(item.id);

  // Sort plans: 115 first, others middle, 114 last
  var sorted = cache.plans.slice().sort(function(a, b) {
    function rank(n) { return n.indexOf('115') >= 0 ? 0 : n.indexOf('114') >= 0 ? 2 : 1; }
    return rank(a.name) - rank(b.name);
  }).filter(function(plan) {
    return cache.projects.some(function(p) {
      return (p.planIds || []).some(function(pid) { return stripDash(pid) === stripDash(plan.id); });
    });
  });

  var pills = sorted.map(function(plan) {
    var pid = 'pp_' + stripDash(plan.id).substring(0,8) + '_' + iid;
    return '<div class="plan-pill" id="' + pid + '" onclick="selPlan(\'' + item.id + '\',\'' + plan.id + '\',\'' + escQ(plan.name) + '\',\'' + pid + '\')">' + esc(plan.name) + '</div>';
  }).join('');

  return '<div class="tree-wrap">'
    + '<div class="plans-row" id="pr_' + iid + '">' + pills + '</div>'
    + '<div class="projs-area" id="pa_' + iid + '"><div class="projs-row" id="prow_' + iid + '"></div></div>'
    + '<div class="cp-area" id="ca_' + iid + '"><div class="cp-lbl" id="clbl_' + iid + '"></div><div class="cp-grid" id="cg_' + iid + '"></div></div>'
    + '</div>';
}

function stripDash(s) { return String(s).replace(/-/g, ''); }
function safeId(s) { return String(s).replace(/[^a-z0-9]/g, ''); }
function escQ(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function toggleTree(itemId) {
  var panel = document.getElementById('treepanel_' + itemId);
  var arrow = document.getElementById('tarrow_' + itemId);
  if (panel.style.display === 'none') { panel.style.display = 'block'; arrow.textContent = '▼'; }
  else { panel.style.display = 'none'; arrow.textContent = '▶'; }
}

// SELECT PLAN
function selPlan(itemId, planId, planName, pillId) {
  var iid = safeId(itemId);
  document.querySelectorAll('#pr_' + iid + ' .plan-pill').forEach(function(el) { el.classList.remove('sel'); });
  var pill = document.getElementById(pillId);
  if (pill) pill.classList.add('sel');

  var projs = cache.projects.filter(function(p) {
    return (p.planIds || []).some(function(pid) { return stripDash(pid) === stripDash(planId); });
  });

  var ca = document.getElementById('ca_' + iid);
  if (ca) { ca.classList.remove('show'); document.getElementById('cg_' + iid).innerHTML = ''; }

  var prow = document.getElementById('prow_' + iid);
  if (prow) {
    prow.innerHTML = projs.map(function(proj) {
      var chipId = 'chip_' + stripDash(proj.id).substring(0,8) + '_' + iid;
      return '<div class="proj-chip" id="' + chipId + '" onclick="selProj(\'' + itemId + '\',\'' + proj.id + '\',\'' + escQ(proj.name) + '\',\'' + planId + '\',\'' + escQ(planName) + '\',\'' + chipId + '\')">'
        + '<span class="chip-arr">▶</span>' + esc(proj.name) + '</div>';
    }).join('') || '<div style="font-size:12px;color:var(--muted)">無專案</div>';
  }
  var pa = document.getElementById('pa_' + iid);
  if (pa) pa.classList.add('show');
}

// SELECT PROJECT
function selProj(itemId, projId, projName, planId, planName, chipId) {
  var iid = safeId(itemId);
  var chip = document.getElementById(chipId);
  var isOpen = chip && chip.classList.contains('open');

  document.querySelectorAll('#prow_' + iid + ' .proj-chip').forEach(function(el) { el.classList.remove('open'); });
  var ca = document.getElementById('ca_' + iid);
  if (isOpen) { if (ca) ca.classList.remove('show'); return; }
  if (chip) chip.classList.add('open');

  var cps = cache.checkpoints.filter(function(c) {
    return (c.projectIds || []).some(function(pid) { return stripDash(pid) === stripDash(projId); });
  });

  var lbl = document.getElementById('clbl_' + iid);
  var grid = document.getElementById('cg_' + iid);
  if (lbl) lbl.textContent = projName;

  var item = queue.filter(function(q) { return q.id === itemId; })[0];
  if (grid) {
    grid.innerHTML = cps.map(function(cp) {
      var isSel = item && item.selCP && item.selCP.id === cp.id ? ' sel' : '';
      var cpShort = stripDash(cp.id).substring(0,8);
      return '<div class="cp-item' + isSel + '" id="tci_' + cpShort + '_' + iid + '"'
        + ' onclick="selCP(\'' + itemId + '\',\'' + cp.id + '\',\'' + escQ(cp.name) + '\',\'' + projId + '\',\'' + escQ(projName) + '\',\'' + planId + '\',\'' + escQ(planName) + '\')">'
        + esc(cp.name) + '</div>';
    }).join('') || '<div style="font-size:12px;color:var(--muted);padding:4px 0">無查核點</div>';
  }
  if (ca) ca.classList.add('show');
}

// SELECT CHECKPOINT
function selCP(itemId, cpId, cpName, projId, projName, planId, planName) {
  var item = queue.filter(function(q) { return q.id === itemId; })[0];
  if (!item) return;
  item.selCP = { id: cpId, name: cpName };
  item.selProj = { id: projId, name: projName };
  item.selPlan = { id: planId, name: planName };

  var path = document.getElementById('path_' + itemId);
  if (path) {
    path.innerHTML = '<span class="pi">' + esc(planName) + '</span><span class="ps">›</span>'
      + '<span class="pi">' + esc(projName) + '</span><span class="ps">›</span>'
      + '<span class="pf">' + esc(cpName) + '</span>';
  }

  var iid = safeId(itemId);
  var cpShort = stripDash(cpId).substring(0,8);
  document.querySelectorAll('[id^="tci_"][id$="_' + iid + '"]').forEach(function(el) { el.classList.remove('sel'); });
  var tci = document.getElementById('tci_' + cpShort + '_' + iid);
  if (tci) tci.classList.add('sel');
}

// SUBMIT
function doSubmit(itemId) {
  var token = ls('notion_token');
  if (!token) { alert('請先設定 Notion Token'); return; }
  var item = queue.filter(function(q) { return q.id === itemId; })[0];
  if (!item) return;

  var nameEl = document.getElementById('tname_' + itemId);
  var dateEl = document.getElementById('tdate_' + itemId);
  var name = nameEl ? nameEl.innerText.trim() : '';
  var dateRaw = dateEl ? dateEl.value : '';

  var btn = document.getElementById('bsub_' + itemId);
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="sp"></span>寫入中...'; }

  var srcMap = { 'Outlook': 'OUTLOOK', 'Line': 'LINE', '會議': '會議', '其他': '其他' };
  var srcVal = srcMap[item.source] || '其他';
  var props = {
    'ToDo': { title: [{ text: { content: name } }] },
    'AI 審核狀態': { select: { name: '🟡待核實' } },
    'AI判斷理由': { rich_text: [{ text: { content: (item.result && item.result.reason) || '' } }] },
    '來源': { select: { name: srcVal } }
  };
  if (dateRaw) props['DoOn'] = { date: { start: dateRaw } };
  if (item.selCP && item.selCP.id) props['所屬查核點'] = { relation: [{ id: item.selCP.id }] };

  fetch(PROXY + '/v1/pages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token, 'Notion-Version': '2022-06-28' },
    body: JSON.stringify({ parent: { database_id: DBS.todo }, properties: props })
  })
  .then(function(res) {
    if (!res.ok) return res.json().then(function(e) { throw new Error(e.message || '寫入失敗'); });
    return res.json();
  })
  .then(function() {
    item.status = 'done';
    renderQueue();
    var card = document.getElementById('rc_' + itemId);
    if (card) card.innerHTML = '<div class="smsg ok">✅ 已建立：' + esc(name) + '<br><small style="color:var(--muted)">'
      + esc((item.selPlan && item.selPlan.name) || '') + ' › '
      + esc((item.selProj && item.selProj.name) || '') + ' › '
      + esc((item.selCP && item.selCP.name) || '') + '</small></div>';
    saveHist({ name: name, doOn: dateRaw, plan: (item.selPlan && item.selPlan.name) || '', project: (item.selProj && item.selProj.name) || '', checkpoint: (item.selCP && item.selCP.name) || '' });
    // auto next
    var next = queue.filter(function(q) { return q.status === 'pending' && q.id !== itemId; })[0];
    if (next) { activeId = next.id; renderQueue(); renderReview(next); }
  })
  .catch(function(e) {
    if (btn) { btn.disabled = false; btn.textContent = '✅ 確認寫入 Notion'; }
    var st = document.getElementById('subst_' + itemId);
    if (st) st.innerHTML = '<div class="smsg err" style="margin-top:9px">❌ ' + esc(e.message) + '</div>';
  });
}

function doSkip(itemId) {
  var item = queue.filter(function(q) { return q.id === itemId; })[0];
  if (item) item.status = 'skipped';
  renderQueue();
  document.getElementById('rev-area').innerHTML = '';
  var next = queue.filter(function(q) { return q.status === 'pending'; })[0];
  if (next) { activeId = next.id; renderQueue(); renderReview(next); }
}

// SYNC
function doSync() {
  var token = ls('notion_token');
  if (!token) { alert('請先儲存 Notion Token'); return; }
  var btn = document.querySelector('.bsync');
  var st = document.getElementById('syncst');
  btn.textContent = '⏳ 同步中...'; btn.disabled = true;
  st.textContent = '正在讀取...';

  Promise.all([
    queryDB(token, DBS.plan, 'plan'),
    queryDB(token, DBS.project, 'project'),
    queryDB(token, DBS.checkpoint, 'checkpoint')
  ])
  .then(function(results) {
    cache = { plans: results[0], projects: results[1], checkpoints: results[2], synced: new Date().toLocaleString('zh-TW') };
    ls('notion_cache', JSON.stringify(cache));
    st.textContent = '✅ 同步完成：' + results[0].length + ' 個計劃、' + results[1].length + ' 個專案、' + results[2].length + ' 個查核點';
    showSyncInfo();
  })
  .catch(function(e) { st.textContent = '❌ 同步失敗：' + e.message; })
  .finally(function() { btn.textContent = '🔄 同步 Notion'; btn.disabled = false; });
}

function queryDB(token, dbId, type) {
  var results = [];
  function go(cursor) {
    var body = { page_size: 100 };
    if (cursor) body.start_cursor = cursor;
    return fetch(PROXY + '/v1/databases/' + dbId + '/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token, 'Notion-Version': '2022-06-28' },
      body: JSON.stringify(body)
    })
    .then(function(res) {
      if (!res.ok) return res.json().then(function(e) { throw new Error(e.message || 'API 錯誤'); });
      return res.json();
    })
    .then(function(data) {
      data.results.forEach(function(p) {
        var props = p.properties, name = '';
        Object.keys(props).forEach(function(k) { if (props[k].type === 'title' && !name) name = props[k].title.map(function(t) { return t.plain_text; }).join(''); });
        if (!name.trim()) return;
        var item = { id: p.id, name: name };
        if (type === 'project') { var r = props['Dt. 計劃'] || props['計劃'] || null; if (r && r.relation) item.planIds = r.relation.map(function(x) { return x.id; }); }
        if (type === 'checkpoint') { var r2 = props['Dt. 專案X-X'] || props['專案'] || null; if (r2 && r2.relation) item.projectIds = r2.relation.map(function(x) { return x.id; }); }
        results.push(item);
      });
      if (data.has_more && data.next_cursor) return go(data.next_cursor);
    });
  }
  return go(null).then(function() { return results; });
}

function showSyncInfo() {
  if (!cache) return;
  document.getElementById('syncinfo').style.display = 'block';
  document.getElementById('syncinfo-body').innerHTML = '同步時間：' + cache.synced
    + '<br>計劃：' + cache.plans.length + ' 個'
    + '<br>專案：' + cache.projects.length + ' 個'
    + '<br>查核點：' + cache.checkpoints.length + ' 個';
}

// SETTINGS
function saveCfg() {
  var t = document.getElementById('ntoken').value.trim();
  var k = document.getElementById('ckey').value.trim();
  if (!t || !k) { alert('請填入兩個 Token'); return; }
  ls('notion_token', t); ls('claude_key', k);
  document.getElementById('setup-notice').style.display = 'none';
  alert('✅ 已儲存！請點「同步 Notion」');
}

// HISTORY
function saveHist(item) {
  var h = JSON.parse(ls('capture_history') || '[]');
  h.unshift(Object.assign({}, item, { time: new Date().toLocaleString('zh-TW') }));
  if (h.length > 50) h.pop();
  ls('capture_history', JSON.stringify(h));
}
function renderHistory() {
  var h = JSON.parse(ls('capture_history') || '[]');
  var el = document.getElementById('hlist');
  if (!el) return;
  if (h.length === 0) { el.innerHTML = '<div class="empty">還沒有記錄</div>'; return; }
  el.innerHTML = h.map(function(i) {
    return '<div class="hi">'
      + '<div><div class="hn">' + esc(i.name) + '</div><div class="hp">' + esc(i.plan || '') + ' › ' + esc(i.project || '') + ' › ' + esc(i.checkpoint || '') + '</div></div>'
      + '<div class="hm">' + esc(i.doOn || '') + '<br>' + esc(i.time) + '</div>'
      + '</div>';
  }).join('');
}
</script>
