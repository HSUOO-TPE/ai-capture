<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Capture → Notion</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f5f4f0; --card: #ffffff; --border: #e0ddd6;
  --text: #1a1a1a; --muted: #6b6860; --accent: #e8571a;
  --accent-hover: #c94a14; --teal: #0f6e56; --success: #1d9e75;
  --amber: #ba7517; --purple: #534ab7; --tag-bg: #f0ede6;
  --sidebar-w: 300px;
}
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

/* HEADER */
.header { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 200; }
.logo { font-size: 15px; font-weight: 600; color: var(--accent); cursor: pointer; }
.header-right { display: flex; gap: 8px; align-items: center; }
.btn-sm { background: none; border: 1px solid var(--border); border-radius: 7px; padding: 5px 12px; font-size: 13px; color: var(--muted); cursor: pointer; }
.btn-sm:hover { border-color: var(--accent); color: var(--accent); }
.queue-badge { background: var(--accent); color: #fff; border-radius: 10px; padding: 1px 7px; font-size: 11px; font-weight: 600; margin-left: 4px; display: none; }

/* LAYOUT */
.layout { display: flex; height: calc(100vh - 49px); }

/* SIDEBAR - queue */
.sidebar { width: var(--sidebar-w); border-right: 1px solid var(--border); background: var(--card); display: flex; flex-direction: column; overflow: hidden; }
.sidebar-header { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.queue-list { flex: 1; overflow-y: auto; padding: 8px; }
.queue-item { border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; cursor: pointer; border: 1.5px solid transparent; transition: all 0.1s; background: var(--bg); }
.queue-item:hover { border-color: var(--border); }
.queue-item.active { border-color: var(--accent); background: #fdf2ec; }
.queue-item.done { opacity: 0.5; }
.queue-item-name { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.queue-item-status { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.dot-analyzing { background: var(--amber); animation: pulse 1s infinite; }
.dot-pending { background: var(--accent); }
.dot-done { background: var(--success); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.queue-empty { text-align: center; padding: 40px 16px; font-size: 13px; color: var(--muted); line-height: 1.6; }

/* MAIN AREA */
.main-area { flex: 1; overflow-y: auto; padding: 20px; }

/* INPUT CARD */
.input-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
.source-tags { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.tag { border: 1.5px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 13px; color: var(--muted); cursor: pointer; background: var(--card); }
.tag.active { border-color: var(--accent); color: var(--accent); background: #fdf2ec; font-weight: 600; }
.input-area { width: 100%; min-height: 90px; border: 1.5px solid var(--border); border-radius: 10px; padding: 12px; font-size: 14px; font-family: inherit; color: var(--text); background: var(--bg); resize: vertical; outline: none; line-height: 1.6; }
.input-area:focus { border-color: var(--accent); background: #fff; }
.input-area::placeholder { color: #aaa; }
.input-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
.char-hint { font-size: 12px; color: var(--muted); }
.btn-analyze { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 9px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn-analyze:hover { background: var(--accent-hover); }
.btn-analyze:disabled { background: #ccc; cursor: not-allowed; }

/* REVIEW CARD */
.review-card { background: var(--card); border: 1.5px solid var(--success); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.review-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.review-label { font-size: 13px; font-weight: 600; color: var(--success); }
.confidence { font-size: 12px; color: var(--muted); background: var(--tag-bg); padding: 3px 10px; border-radius: 20px; }

/* PATH DISPLAY */
.path-display { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 9px 12px; background: var(--tag-bg); border-radius: 8px; margin-bottom: 12px; }
.path-item { font-size: 13px; font-weight: 500; }
.path-sep { font-size: 13px; color: var(--muted); }
.path-final { font-size: 13px; font-weight: 600; color: var(--accent); }

.reason-box { background: #f9f8f5; border-left: 3px solid var(--amber); border-radius: 0 8px 8px 0; padding: 9px 12px; margin-bottom: 14px; font-size: 13px; color: var(--muted); line-height: 1.6; }

/* FIELDS */
.field { margin-bottom: 12px; }
.field-label { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
.field-value { font-size: 14px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; line-height: 1.5; outline: none; width: 100%; }
.field-value:focus { border-color: var(--accent); background: #fff; }
.field input[type="date"] { width: 100%; font-size: 14px; font-family: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; outline: none; }
.field input[type="date"]:focus { border-color: var(--accent); background: #fff; }

/* TREE SELECTOR */
.tree-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--accent); margin-bottom: 10px; user-select: none; }
.tree-toggle:hover { text-decoration: underline; }
.tree-panel { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 14px; max-height: 360px; overflow-y: auto; }
.tree-plan { border-bottom: 1px solid var(--border); }
.tree-plan:last-child { border-bottom: none; }
.tree-plan-header { display: flex; align-items: center; gap: 8px; padding: 9px 14px; cursor: pointer; background: var(--tag-bg); font-size: 13px; font-weight: 600; color: var(--text); user-select: none; }
.tree-plan-header:hover { background: #e8e5de; }
.tree-chevron { font-size: 10px; color: var(--muted); transition: transform 0.2s; }
.tree-chevron.open { transform: rotate(90deg); }
.tree-projects { display: none; }
.tree-projects.open { display: block; }
.tree-project-header { display: flex; align-items: center; gap: 6px; padding: 7px 14px 7px 28px; cursor: pointer; background: #faf9f6; font-size: 12px; font-weight: 600; color: var(--muted); border-top: 1px solid var(--border); user-select: none; }
.tree-project-header:hover { background: #f0ede6; }
.tree-checkpoints { display: none; }
.tree-checkpoints.open { display: block; }
.tree-cp-item { padding: 6px 14px 6px 44px; font-size: 13px; color: var(--text); cursor: pointer; border-top: 1px solid #f0ede6; }
.tree-cp-item:hover { background: #fdf2ec; color: var(--accent); }
.tree-cp-item.selected { background: #fdf2ec; color: var(--accent); font-weight: 600; }

/* ACTIONS */
.actions { display: flex; gap: 10px; margin-top: 16px; }
.btn-submit { flex: 1; background: var(--success); color: #fff; border: none; border-radius: 8px; padding: 11px; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn-submit:hover { background: #0a8a63; }
.btn-submit:disabled { background: #ccc; cursor: not-allowed; }
.btn-skip { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 11px 18px; font-size: 13px; color: var(--muted); cursor: pointer; }
.btn-skip:hover { border-color: #aaa; }

/* STATUS */
.status-msg { text-align: center; padding: 14px; font-size: 14px; border-radius: 10px; margin-bottom: 14px; }
.status-msg.success { background: #e6f7f1; color: var(--success); border: 1px solid #9fe1cb; }
.status-msg.error { background: #fce8e8; color: #a32d2d; border: 1px solid #f09595; }

/* SETTINGS */
.settings-wrap { padding: 20px; max-width: 540px; }
.settings-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.settings-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px; }
.settings-field { margin-bottom: 16px; }
.settings-label { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 5px; }
.settings-hint { font-size: 12px; color: var(--muted); margin-bottom: 6px; line-height: 1.5; }
.settings-input { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; font-size: 13px; font-family: monospace; color: var(--text); background: var(--bg); outline: none; }
.settings-input:focus { border-color: var(--accent); background: #fff; }
.btn-save { background: var(--purple); color: #fff; border: none; border-radius: 8px; padding: 9px 20px; font-size: 13px; font-weight: 600; cursor: pointer; margin-right: 8px; }
.btn-sync { background: var(--teal); color: #fff; border: none; border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
.sync-status { margin-top: 10px; font-size: 13px; color: var(--muted); }
.sync-info { font-size: 13px; color: var(--muted); line-height: 1.8; }

/* SETUP NOTICE */
.setup-notice { background: #fdf2ec; border: 1.5px solid var(--accent); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
.setup-title { font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 5px; }
.setup-text { font-size: 13px; color: var(--text); line-height: 1.6; }
.setup-steps { margin-top: 8px; padding-left: 16px; }
.setup-steps li { font-size: 13px; color: var(--muted); margin-bottom: 3px; }

/* HISTORY */
.history-wrap { padding: 20px; }
.history-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
.history-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; }
.history-item { padding: 11px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 12px; }
.history-item:last-child { border-bottom: none; }
.history-name { font-size: 14px; color: var(--text); }
.history-path { font-size: 12px; color: var(--accent); margin-top: 2px; }
.history-meta { font-size: 12px; color: var(--muted); white-space: nowrap; text-align: right; }
.empty-state { text-align: center; padding: 40px 20px; font-size: 13px; color: var(--muted); }

/* SPINNER */
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 5px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* MOBILE */
@media (max-width: 600px) {
  :root { --sidebar-w: 240px; }
  .layout { flex-direction: column; height: auto; }
  .sidebar { width: 100%; height: 160px; border-right: none; border-bottom: 1px solid var(--border); }
  .main-area { padding: 14px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="logo" onclick="showView('main')">⚡ AI Capture</div>
  <div class="header-right">
    <button class="btn-sm" onclick="showView('history')">記錄</button>
    <button class="btn-sm" onclick="showView('settings')">設定</button>
  </div>
</div>

<div class="layout" id="app-layout">
  <!-- SIDEBAR: queue -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span>待處理佇列</span>
      <span id="queue-count" style="font-size:12px;color:var(--muted)">0 筆</span>
    </div>
    <div class="queue-list" id="queue-list">
      <div class="queue-empty">貼入訊息後<br>會出現在這裡</div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main-area" id="main-area">

    <!-- SETUP NOTICE -->
    <div class="setup-notice" id="setup-notice" style="display:none">
      <div class="setup-title">⚙️ 請先完成設定</div>
      <div class="setup-text">點右上角「設定」，填入 Notion Token 與 Claude API Key，然後同步資料庫。</div>
    </div>

    <!-- INPUT -->
    <div class="input-card" id="view-input">
      <div class="source-tags">
        <div class="tag active" onclick="selectSource(this,'Outlook')">📧 Outlook</div>
        <div class="tag" onclick="selectSource(this,'Line')">💬 Line</div>
        <div class="tag" onclick="selectSource(this,'會議')">🗓 會議</div>
        <div class="tag" onclick="selectSource(this,'其他')">✏️ 其他</div>
      </div>
      <textarea class="input-area" id="input-text" placeholder="把 Outlook 信件、Line 訊息貼在這裡..." oninput="updateChar()"></textarea>
      <div class="input-footer">
        <span class="char-hint" id="char-count">0 字</span>
        <button class="btn-analyze" id="btn-analyze" onclick="submitInput()">🔍 AI 分析</button>
      </div>
    </div>

    <!-- REVIEW AREA -->
    <div id="review-area"></div>

  </div>
</div>

<!-- SETTINGS VIEW -->
<div id="view-settings" style="display:none">
  <div class="settings-wrap">
    <div class="settings-card">
      <div class="settings-title">設定</div>
      <div class="settings-field">
        <div class="settings-label">Notion API Token</div>
        <div class="settings-hint">ANTIGRAVITY Integration Token（secret_... 開頭）</div>
        <input class="settings-input" type="password" id="notion-token" placeholder="secret_...">
      </div>
      <div class="settings-field">
        <div class="settings-label">Claude API Key</div>
        <div class="settings-hint">Anthropic API Key（sk-ant-... 開頭）</div>
        <input class="settings-input" type="password" id="claude-key" placeholder="sk-ant-...">
      </div>
      <button class="btn-save" onclick="saveSettings()">💾 儲存</button>
      <button class="btn-sync" onclick="syncNotion()">🔄 同步 Notion</button>
      <div class="sync-status" id="sync-status"></div>
    </div>
    <div class="settings-card" id="sync-info-card" style="display:none">
      <div class="settings-title">已同步資料</div>
      <div class="sync-info" id="sync-info-content"></div>
    </div>
  </div>
</div>

<!-- HISTORY VIEW -->
<div id="view-history" style="display:none">
  <div class="history-wrap">
    <div class="history-card">
      <div class="history-title">最近建立記錄</div>
      <div id="history-list"><div class="empty-state">還沒有記錄</div></div>
    </div>
  </div>
</div>

<script>
const DB_IDS = {
  plan:'2039cedd371d8092b7f3c222f43778c4',
  planItem:'2039cedd371d80aea57ada5f5230dc41',
  project:'2039cedd371d800f9271c3a9c7610eb8',
  projItem:'2039cedd371d805eb00dd135a945b469',
  checkpoint:'2039cedd371d80798955effa678aafe1',
  todo:'2039cedd371d8010ae84f60c29f86990',
};
const PROXY = 'https://notion-proxy.tca-hsuoo.workers.dev/notion';

let currentSource = 'Outlook';
let notionCache = null;
let queue = []; // [{id, text, source, status:'analyzing'|'pending'|'done'|'skipped', result, selectedCP, selectedProj, selectedPlan}]
let activeId = null;

// ===== INIT =====
window.onload = () => {
  loadSettings();
  loadHistory();
  const cached = localStorage.getItem('notion_cache');
  if (cached) { notionCache = JSON.parse(cached); updateSyncInfo(); }
  const t = localStorage.getItem('notion_token');
  const k = localStorage.getItem('claude_key');
  if (!t || !k) document.getElementById('setup-notice').style.display = 'block';
};

// ===== VIEW =====
function showView(v) {
  document.getElementById('app-layout').style.display = v==='main' ? 'flex' : 'none';
  document.getElementById('view-settings').style.display = v==='settings' ? 'block' : 'none';
  document.getElementById('view-history').style.display = v==='history' ? 'block' : 'none';
  if (v==='history') loadHistory();
}

// ===== SOURCE =====
function selectSource(el, src) {
  document.querySelectorAll('.tag').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  currentSource = src;
}
function updateChar() {
  document.getElementById('char-count').textContent = document.getElementById('input-text').value.length + ' 字';
}

// ===== QUEUE =====
function renderQueue() {
  const el = document.getElementById('queue-list');
  const count = document.getElementById('queue-count');
  const pending = queue.filter(q=>q.status!=='done'&&q.status!=='skipped').length;
  count.textContent = pending + ' 筆';
  if (queue.length === 0) {
    el.innerHTML = '<div class="queue-empty">貼入訊息後<br>會出現在這裡</div>';
    return;
  }
  el.innerHTML = queue.map(item => {
    const statusMap = {analyzing:'分析中',pending:'待審核',done:'已完成',skipped:'已略過'};
    const dotMap = {analyzing:'dot-analyzing',pending:'dot-pending',done:'dot-done',skipped:''};
    return `<div class="queue-item ${item.id===activeId?'active':''} ${item.status==='done'||item.status==='skipped'?'done':''}"
      onclick="selectQueueItem('${item.id}')">
      <div class="queue-item-name">${item.text.substring(0,40)}${item.text.length>40?'...':''}</div>
      <div class="queue-item-status">
        <span class="dot ${dotMap[item.status]||''}"></span>
        ${statusMap[item.status]||item.status}
        ${item.status==='pending'?' · 等待確認':''}
      </div>
    </div>`;
  }).join('');
}

function selectQueueItem(id) {
  activeId = id;
  renderQueue();
  const item = queue.find(q=>q.id===id);
  if (!item) return;
  if (item.status==='pending') renderReview(item);
  else if (item.status==='done'||item.status==='skipped') {
    document.getElementById('review-area').innerHTML = `<div class="status-msg success">✅ 已${item.status==='done'?'寫入':'略過'}：${item.text.substring(0,30)}...</div>`;
  }
}

// ===== SUBMIT INPUT =====
async function submitInput() {
  const text = document.getElementById('input-text').value.trim();
  if (!text) { alert('請先輸入內容'); return; }
  const claudeKey = localStorage.getItem('claude_key');
  if (!claudeKey) { alert('請先在設定中填入 Claude API Key'); return; }
  if (!notionCache) { alert('請先同步 Notion 資料庫'); return; }

  const id = 'q_' + Date.now();
  const item = { id, text, source: currentSource, status: 'analyzing', result: null, selectedCP: null, selectedProj: null, selectedPlan: null };
  queue.unshift(item);
  activeId = id;
  renderQueue();
  document.getElementById('input-text').value = '';
  document.getElementById('char-count').textContent = '0 字';
  document.getElementById('review-area').innerHTML = `<div class="status-msg" style="background:#f0ede6;color:var(--muted)"><span class="spinner" style="border-color:var(--muted);border-top-color:transparent"></span>AI 分析中...</div>`;

  try {
    const result = await callClaude(text, currentSource);
    item.result = result;
    item.status = 'pending';
    if (result && result.checkpoint) {
      item.selectedCP = result.checkpoint;
      item.selectedProj = result.project;
      item.selectedPlan = result.plan;
    }
    renderQueue();
    renderReview(item);
  } catch(e) {
    item.status = 'skipped';
    renderQueue();
    document.getElementById('review-area').innerHTML = `<div class="status-msg error">❌ 分析失敗：${e.message}</div>`;
  }
}

// ===== CLAUDE =====
async function callClaude(text, source) {
  const claudeKey = localStorage.getItem('claude_key');
  const ctx = buildContext();
  const prompt = buildPrompt(text, source, ctx);
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': claudeKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 1000, messages: [{ role: 'user', content: prompt }] }),
  });
  if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || 'Claude API 錯誤'); }
  const data = await res.json();
  const raw = data.content[0].text;
  const clean = raw.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

function buildContext() {
  if (!notionCache) return {};
  return {
    plans: notionCache.plans.map(p=>({id:p.id,name:p.name})),
    projects: notionCache.projects.map(p=>({id:p.id,name:p.name,planIds:p.planIds||[]})),
    checkpoints: notionCache.checkpoints.map(c=>({id:c.id,name:c.name,code:c.code||'',projectIds:c.projectIds||[]})),
  };
}

function buildPrompt(text, source, ctx) {
  return `你是 Notion 待辦事項建立助手。根據輸入內容，判斷應建立哪個待辦事項並對應到正確的查核點。

## Notion 結構
計劃：${JSON.stringify(ctx.plans)}
專案（含所屬計劃ID）：${JSON.stringify(ctx.projects)}
查核點（含所屬專案ID）：${JSON.stringify(ctx.checkpoints)}

## 使用者輸入
來源：${source}
內容：${text}

## TODO 命名規則（嚴格遵守）
1. 必須以動詞開頭：回覆、確認、追蹤、提交、製作、校閱、撰寫、通知、聯繫、整理、準備、安排、修改、提供、完稿、請款、填寫
2. 特殊符號前綴：⛔=會議類、⚠️=重要提交截止、❗=緊急確認、🆘=非常緊急、📞=電話聯繫、🚩=里程碑、無符號=一般
3. 格式：符號＋動詞：對象或事項（例如「⚠️提交：小八確認 Q2業績簡報」）

## 回傳格式（純 JSON，不要其他文字）
{
  "name": "待辦名稱（遵守命名規則）",
  "doOn": "YYYY-MM-DD 或 null",
  "checkpoint": {"id": "notion_page_id", "name": "查核點名稱"},
  "project": {"id": "notion_page_id", "name": "專案名稱"},
  "plan": {"id": "notion_page_id", "name": "計劃名稱"},
  "reason": "判斷理由（20字以內）",
  "confidence": "high/medium/low"
}`;
}

// ===== RENDER REVIEW =====
function renderReview(item) {
  if (!item.result) return;
  const r = item.result;
  const confColor = r.confidence==='high'?'var(--success)':r.confidence==='medium'?'var(--amber)':'#a32d2d';
  const confText = r.confidence==='high'?'高信心':r.confidence==='medium'?'中信心':'低信心';

  document.getElementById('review-area').innerHTML = `
    <div class="review-card" id="rc_${item.id}">
      <div class="review-header">
        <div class="review-label">📌 待審核</div>
        <div class="confidence" style="color:${confColor}">${confText}</div>
      </div>

      <div class="path-display" id="path_${item.id}">
        <span class="path-item">${item.selectedPlan?.name||'未知計劃'}</span>
        <span class="path-sep">›</span>
        <span class="path-item">${item.selectedProj?.name||'未知專案'}</span>
        <span class="path-sep">›</span>
        <span class="path-final">${item.selectedCP?.name||'未指定查核點'}</span>
      </div>

      <div class="reason-box">${r.reason||''}</div>

      <div class="field">
        <div class="field-label">待辦名稱</div>
        <div class="field-value" id="todo-name_${item.id}" contenteditable="true">${r.name}</div>
      </div>
      <div class="field">
        <div class="field-label">截止日期</div>
        <input type="date" id="todo-date_${item.id}" value="${r.doOn||''}">
      </div>

      <div class="tree-toggle" onclick="toggleTree('${item.id}')">
        <span id="tree-toggle-icon_${item.id}">▶</span> 手動選擇查核點
      </div>
      <div id="tree_${item.id}" style="display:none">
        ${buildTree(item)}
      </div>

      <div class="actions">
        <button class="btn-submit" onclick="submitTodo('${item.id}')">✅ 確認寫入 Notion</button>
        <button class="btn-skip" onclick="skipItem('${item.id}')">略過</button>
      </div>
      <div id="submit-status_${item.id}"></div>
    </div>`;
}

// ===== TREE =====
function buildTree(item) {
  if (!notionCache) return '<div style="padding:12px;font-size:13px;color:var(--muted)">尚未同步資料</div>';
  const { plans, projects, checkpoints } = notionCache;

  // 建立 plan → projects → checkpoints 對應
  return `<div class="tree-panel">${plans.map(plan => {
    const planProjects = projects.filter(p => (p.planIds||[]).some(pid => pid.replace(/-/g,'') === plan.id.replace(/-/g,'')));
    if (planProjects.length === 0) return '';
    const planId = 'tp_' + plan.id.replace(/-/g,'').substring(0,8) + '_' + item.id.replace(/[^a-z0-9]/g,'');
    return `<div class="tree-plan">
      <div class="tree-plan-header" onclick="togglePlan('${planId}')">
        <span class="tree-chevron" id="chev_${planId}">▶</span>
        ${plan.name}
      </div>
      <div class="tree-projects" id="${planId}">
        ${planProjects.map(proj => {
          const projCPs = checkpoints.filter(c => (c.projectIds||[]).some(pid => pid.replace(/-/g,'') === proj.id.replace(/-/g,'')));
          const projId = 'tpr_' + proj.id.replace(/-/g,'').substring(0,8) + '_' + item.id.replace(/[^a-z0-9]/g,'');
          return `<div>
            <div class="tree-project-header" onclick="toggleProject('${projId}')">
              <span style="font-size:10px;color:var(--muted)" id="pchev_${projId}">▶</span>
              ${proj.name}
            </div>
            <div class="tree-checkpoints" id="${projId}">
              ${projCPs.length > 0 ? projCPs.map(cp => `
                <div class="tree-cp-item ${item.selectedCP?.id===cp.id?'selected':''}"
                  id="tci_${cp.id.replace(/-/g,'').substring(0,8)}_${item.id.replace(/[^a-z0-9]/g,'')}"
                  onclick="selectCP('${item.id}','${cp.id}','${cp.name.replace(/'/g,"\\'")}','${proj.id}','${proj.name.replace(/'/g,"\\'")}','${plan.id}','${plan.name.replace(/'/g,"\\'")}')">
                  ${cp.name}
                </div>`).join('') : '<div style="padding:6px 14px 6px 44px;font-size:12px;color:var(--muted)">無查核點</div>'}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('')}</div>`;
}

function toggleTree(itemId) {
  const el = document.getElementById('tree_'+itemId);
  const icon = document.getElementById('tree-toggle-icon_'+itemId);
  if (el.style.display === 'none') { el.style.display = 'block'; icon.textContent = '▼'; }
  else { el.style.display = 'none'; icon.textContent = '▶'; }
}

function togglePlan(planId) {
  const el = document.getElementById(planId);
  const chev = document.getElementById('chev_'+planId);
  if (el.classList.contains('open')) { el.classList.remove('open'); chev.classList.remove('open'); }
  else { el.classList.add('open'); chev.classList.add('open'); }
}

function toggleProject(projId) {
  const el = document.getElementById(projId);
  const chev = document.getElementById('pchev_'+projId);
  if (el.classList.contains('open')) { el.classList.remove('open'); chev.style.transform='rotate(0deg)'; }
  else { el.classList.add('open'); chev.style.transform='rotate(90deg)'; }
}

function selectCP(itemId, cpId, cpName, projId, projName, planId, planName) {
  const item = queue.find(q=>q.id===itemId);
  if (!item) return;
  item.selectedCP = { id: cpId, name: cpName };
  item.selectedProj = { id: projId, name: projName };
  item.selectedPlan = { id: planId, name: planName };
  // Update path display
  const path = document.getElementById('path_'+itemId);
  if (path) path.innerHTML = `
    <span class="path-item">${planName}</span>
    <span class="path-sep">›</span>
    <span class="path-item">${projName}</span>
    <span class="path-sep">›</span>
    <span class="path-final">${cpName}</span>`;
  // Update selected highlight
  document.querySelectorAll(`[id^="tci_"][id$="_${itemId.replace(/[^a-z0-9]/g,'')}"]`).forEach(el => el.classList.remove('selected'));
  const tci = document.getElementById(`tci_${cpId.replace(/-/g,'').substring(0,8)}_${itemId.replace(/[^a-z0-9]/g,'')}`);
  if (tci) tci.classList.add('selected');
}

// ===== SUBMIT TODO =====
async function submitTodo(itemId) {
  const token = localStorage.getItem('notion_token');
  if (!token) { alert('請先設定 Notion Token'); return; }
  const item = queue.find(q=>q.id===itemId);
  if (!item) return;

  const name = document.getElementById('todo-name_'+itemId)?.innerText.trim();
  const dateRaw = document.getElementById('todo-date_'+itemId)?.value;

  const btn = document.querySelector(`#rc_${itemId} .btn-submit`);
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>寫入中...'; }

  try {
    const properties = {
      'ToDo': { title: [{ text: { content: name } }] },
      'AI 審核狀態': { select: { name: '待核實' } },
      'AI判斷理由': { rich_text: [{ text: { content: item.result?.reason || '' } }] },
    };
    if (dateRaw) properties['DoOn'] = { date: { start: dateRaw } };
    if (item.selectedCP?.id) properties['所屬查核點'] = { relation: [{ id: item.selectedCP.id }] };

    const res = await fetch(`${PROXY}/v1/pages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token, 'Notion-Version': '2022-06-28' },
      body: JSON.stringify({ parent: { database_id: DB_IDS.todo }, properties }),
    });
    if (!res.ok) { const e = await res.json(); throw new Error(e.message || '寫入失敗'); }

    item.status = 'done';
    renderQueue();
    const card = document.getElementById('rc_'+itemId);
    if (card) card.innerHTML = `<div class="status-msg success">✅ 已建立：${name}<br><small style="color:var(--muted)">${item.selectedPlan?.name||''} › ${item.selectedProj?.name||''} › ${item.selectedCP?.name||''}</small></div>`;
    saveHistory({ name, doOn: dateRaw, plan: item.selectedPlan?.name, project: item.selectedProj?.name, checkpoint: item.selectedCP?.name });

    // Auto select next pending
    const next = queue.find(q=>q.status==='pending'&&q.id!==itemId);
    if (next) { activeId = next.id; renderQueue(); renderReview(next); }

  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = '✅ 確認寫入 Notion'; }
    document.getElementById('submit-status_'+itemId).innerHTML = `<div class="status-msg error" style="margin-top:10px">❌ ${e.message}</div>`;
  }
}

function skipItem(itemId) {
  const item = queue.find(q=>q.id===itemId);
  if (item) item.status = 'skipped';
  renderQueue();
  document.getElementById('review-area').innerHTML = '';
  const next = queue.find(q=>q.status==='pending');
  if (next) { activeId = next.id; renderQueue(); renderReview(next); }
}

// ===== NOTION SYNC =====
async function syncNotion() {
  const token = localStorage.getItem('notion_token');
  if (!token) { alert('請先儲存 Notion Token'); return; }
  const btn = document.querySelector('.btn-sync');
  const status = document.getElementById('sync-status');
  btn.textContent = '⏳ 同步中...'; btn.disabled = true;
  status.textContent = '正在讀取...';
  try {
    const [plans, projects, checkpoints] = await Promise.all([
      queryDB(token, DB_IDS.plan, 'plan'),
      queryDB(token, DB_IDS.project, 'project'),
      queryDB(token, DB_IDS.checkpoint, 'checkpoint'),
    ]);
    notionCache = { plans, projects, checkpoints, synced: new Date().toLocaleString('zh-TW') };
    localStorage.setItem('notion_cache', JSON.stringify(notionCache));
    status.textContent = `✅ 同步完成：${plans.length} 個計劃、${projects.length} 個專案、${checkpoints.length} 個查核點`;
    updateSyncInfo();
  } catch(e) {
    status.textContent = '❌ 同步失敗：' + e.message;
  } finally {
    btn.textContent = '🔄 同步 Notion'; btn.disabled = false;
  }
}

async function queryDB(token, dbId, type) {
  const results = []; let cursor = null;
  do {
    const body = { page_size: 100 };
    if (cursor) body.start_cursor = cursor;
    const res = await fetch(`${PROXY}/v1/databases/${dbId}/query`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token, 'Notion-Version': '2022-06-28' },
      body: JSON.stringify(body),
    });
    if (!res.ok) { const e = await res.json(); throw new Error(e.message || 'Notion API 錯誤'); }
    const data = await res.json();
    results.push(...parseResults(data.results, type));
    cursor = data.has_more ? data.next_cursor : null;
  } while (cursor);
  return results;
}

function parseResults(pages, type) {
  return pages.map(p => {
    const props = p.properties;
    let name = '';
    for (const key of Object.keys(props)) {
      if (props[key].type === 'title') { name = props[key].title.map(t=>t.plain_text).join(''); break; }
    }
    const item = { id: p.id, name };
    if (type === 'project') {
      const r = props['Dt. 計劃']||props['計劃']||null;
      if (r?.relation) item.planIds = r.relation.map(x=>x.id);
    }
    if (type === 'checkpoint') {
      const r = props['Dt. 專案X-X']||props['專案']||null;
      if (r?.relation) item.projectIds = r.relation.map(x=>x.id);
      const c = props['查核點代號'];
      if (c?.rich_text) item.code = c.rich_text.map(t=>t.plain_text).join('');
    }
    return item;
  }).filter(i=>i.name.trim());
}

function updateSyncInfo() {
  if (!notionCache) return;
  document.getElementById('sync-info-card').style.display = 'block';
  document.getElementById('sync-info-content').innerHTML =
    `同步時間：${notionCache.synced}<br>計劃：${notionCache.plans.length} 個<br>專案：${notionCache.projects.length} 個<br>查核點：${notionCache.checkpoints.length} 個`;
}

// ===== SETTINGS =====
function loadSettings() {
  const t = localStorage.getItem('notion_token');
  const k = localStorage.getItem('claude_key');
  if (t) document.getElementById('notion-token').value = t;
  if (k) document.getElementById('claude-key').value = k;
}
function saveSettings() {
  const t = document.getElementById('notion-token').value.trim();
  const k = document.getElementById('claude-key').value.trim();
  if (!t || !k) { alert('請填入兩個 Token'); return; }
  localStorage.setItem('notion_token', t);
  localStorage.setItem('claude_key', k);
  document.getElementById('setup-notice').style.display = 'none';
  alert('✅ 已儲存！請點「同步 Notion」');
}

// ===== HISTORY =====
function saveHistory(item) {
  const h = JSON.parse(localStorage.getItem('capture_history')||'[]');
  h.unshift({...item, time: new Date().toLocaleString('zh-TW')});
  if (h.length > 50) h.pop();
  localStorage.setItem('capture_history', JSON.stringify(h));
}
function loadHistory() {
  const h = JSON.parse(localStorage.getItem('capture_history')||'[]');
  const el = document.getElementById('history-list');
  if (!el) return;
  if (h.length === 0) { el.innerHTML = '<div class="empty-state">還沒有記錄</div>'; return; }
  el.innerHTML = h.map(i=>`
    <div class="history-item">
      <div><div class="history-name">${i.name}</div><div class="history-path">${i.plan||''} › ${i.project||''} › ${i.checkpoint||''}</div></div>
      <div class="history-meta">${i.doOn||''}<br>${i.time}</div>
    </div>`).join('');
}
