<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>名片掃描 → Notion</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f4f0;--card:#fff;--border:#e0ddd6;--text:#1a1a1a;--muted:#6b6860;--accent:#e8571a;--ah:#c94a14;--teal:#0f6e56;--success:#1d9e75;--amber:#ba7517;--purple:#534ab7;--tag:#f0ede6}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
.hd{background:var(--card);border-bottom:1px solid var(--border);padding:11px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:300}
.logo{font-size:15px;font-weight:600;color:var(--accent)}
.hd-r{display:flex;gap:8px}
.bsm{background:none;border:1px solid var(--border);border-radius:7px;padding:5px 12px;font-size:13px;color:var(--muted);cursor:pointer}
.bsm:hover{border-color:var(--accent);color:var(--accent)}
.submit-bar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:48px;z-index:200;gap:12px}
.sb-info{font-size:13px;color:var(--muted)}
.sb-info b{color:var(--accent);font-size:15px}
.bsubmitall{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 22px;font-size:14px;font-weight:600;cursor:pointer}
.bsubmitall:hover{background:var(--ah)}
.bsubmitall:disabled{background:#ccc;cursor:not-allowed}
.main{max-width:860px;margin:0 auto;padding:16px 16px 60px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}
.setup{background:#fdf2ec;border:1.5px solid var(--accent);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.setup-t{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:4px}
.setup-b{font-size:13px;color:var(--text);line-height:1.6}
.ia{width:100%;min-height:120px;border:1.5px solid var(--border);border-radius:10px;padding:12px;font-size:14px;font-family:inherit;color:var(--text);background:var(--bg);resize:vertical;outline:none;line-height:1.6}
.ia:focus{border-color:var(--accent);background:#fff}
.ia::placeholder{color:#bbb}
.date-row{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.date-label{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}
input[type=date]{border:1px solid var(--border);border-radius:8px;padding:7px 11px;font-size:14px;font-family:inherit;color:var(--text);background:var(--bg);outline:none}
input[type=date]:focus{border-color:var(--accent);background:#fff}
.bparse{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:14px;font-weight:600;cursor:pointer;margin-left:auto}
.bparse:hover{background:var(--ah)}
.bparse:disabled{background:#ccc;cursor:not-allowed}
.smsg{text-align:center;padding:12px;font-size:14px;border-radius:10px;margin-bottom:12px}
.smsg.err{background:#fce8e8;color:#a32d2d;border:1px solid #f09595}
.smsg.loading{background:var(--tag);color:var(--muted)}
.todo-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.todo-tag{border:1.5px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--muted);cursor:pointer;background:var(--card)}
.todo-tag:hover{border-color:var(--accent);color:var(--accent)}
.todo-tag.sel{border-color:var(--accent);color:var(--accent);background:#fdf2ec;font-weight:600}
.cb{border:1.5px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden;background:var(--bg)}
.cb.queued{border-color:var(--success);background:#f0fdf8}
.cb.written{opacity:.55}
.cb-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;background:var(--card);gap:8px;flex-wrap:wrap}
.cb-name{font-size:14px;font-weight:600;color:var(--text)}
.cb-company{font-size:12px;color:var(--muted)}
.cb-hd-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.vs-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px;white-space:nowrap}
.vs-exists{background:#e6f7f1;color:var(--success)}
.vs-similar{background:#fef3c7;color:var(--amber)}
.vs-new{background:var(--tag);color:var(--muted)}
.q-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px;background:#e6f7f1;color:var(--success)}
.w-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px;background:var(--tag);color:var(--muted)}
.cb-body{padding:14px;border-top:1px solid var(--border);display:none}
.cb-body.open{display:block}
.vmwarn{background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;padding:9px 12px;font-size:13px;color:#92400e;margin-bottom:12px}
.fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media(max-width:560px){.fields-grid{grid-template-columns:1fr}}
.fl{display:flex;flex-direction:column;gap:4px}
.fl.full{grid-column:1/-1}
.fl-lb{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.fv{font-size:14px;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 10px;width:100%;outline:none;font-family:inherit}
.fv:focus{border-color:var(--accent);background:#fff}
.ms-wrap{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.ms-chip{border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--muted);cursor:pointer;background:var(--card)}
.ms-chip:hover{border-color:var(--accent);color:var(--accent)}
.ms-chip.sel{border-color:var(--accent);color:var(--accent);background:#fdf2ec;font-weight:600}
.todo-rel{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.trc{border:1px solid var(--border);border-radius:6px;padding:3px 9px;font-size:12px;color:var(--muted);cursor:pointer;background:var(--card)}
.trc:hover{border-color:var(--accent);color:var(--accent)}
.trc.sel{border-color:var(--success);color:var(--success);background:#e6f7f1;font-weight:600}
.cb-actions{display:flex;gap:8px;margin-top:14px}
.badd{background:var(--success);color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer}
.badd:hover{background:#0a8a63}
.bcancel{background:none;border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-size:11px;color:var(--muted);cursor:pointer}
.bcancel:hover{border-color:var(--accent);color:var(--accent)}
.pg{padding:18px;max-width:520px}
.pgc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px}
.pgt{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}
.pgf{margin-bottom:14px}
.pgl{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
.pgh{font-size:12px;color:var(--muted);margin-bottom:5px;line-height:1.5}
.pgi{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:13px;font-family:monospace;color:var(--text);background:var(--bg);outline:none}
.pgi:focus{border-color:var(--accent);background:#fff}
.bsave{background:var(--purple);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:13px;font-weight:600;cursor:pointer;margin-right:7px}
.bsync{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
.sync-st{margin-top:9px;font-size:13px;color:var(--muted)}
.sp{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="hd">
  <div class="logo">🪪 名片掃描 → Notion</div>
  <div class="hd-r">
    <button class="bsm" onclick="gopage('settings')">設定</button>
    <button class="bsm" onclick="location.href='https://hsuoo-tpe.github.io/ai-capture/'">AI Capture</button>
  </div>
</div>

<div class="submit-bar">
  <div class="sb-info" id="queue-info">尚無待寫入名片</div>
  <button class="bsubmitall" id="btn-submit-all" onclick="submitAll()" disabled>✅ 全部寫入 Notion</button>
</div>

<div id="view-main" class="main">
  <div class="setup" id="setup-notice" style="display:none">
    <div class="setup-t">⚙️ 請先完成設定</div>
    <div class="setup-b">點右上角「設定」，填入 Notion Token 與 Claude API Key，然後同步廠商資料庫。</div>
  </div>

  <div class="card">
    <div class="card-title">貼入名片判讀文字</div>
    <textarea class="ia" id="card-input" placeholder="貼入 GPT / Gemini 判讀的名片文字&#10;多筆名片用空白行或 --- 分隔&#10;&#10;解析完成後此欄會清空，可繼續貼入下一批"></textarea>
    <div class="date-row">
      <span class="date-label">📅 認識日期</span>
      <input type="date" id="meet-date">
      <button class="bparse" id="btn-parse" onclick="doParse()">🔍 解析並加入清單</button>
    </div>
  </div>

  <div class="card" id="todo-card" style="display:none">
    <div class="card-title">關聯當天會議 Todo（可多選，套用至所有名片）</div>
    <div id="todo-status" style="font-size:13px;color:var(--muted)"></div>
    <div class="todo-list" id="todo-list"></div>
  </div>

  <div id="parse-status"></div>
  <div id="contacts-area"></div>
</div>

<div id="view-settings" style="display:none">
  <div class="pg">
    <div class="pgc">
      <div class="pgt">設定</div>
      <div class="pgf">
        <div class="pgl">Notion API Token</div>
        <div class="pgh">ANTIGRAVITY Integration Token（secret_... 或 ntn_... 開頭）</div>
        <input class="pgi" type="password" id="ntoken" placeholder="secret_...">
      </div>
      <div class="pgf">
        <div class="pgl">Claude API Key</div>
        <div class="pgh">Anthropic API Key（sk-ant-... 開頭）</div>
        <input class="pgi" type="password" id="ckey" placeholder="sk-ant-...">
      </div>
      <button class="bsave" onclick="saveCfg()">💾 儲存</button>
      <button class="bsync" onclick="doSyncVendors()">🔄 同步廠商資料庫</button>
      <div class="sync-st" id="syncst"></div>
    </div>
    <div class="pgc" id="syncinfo" style="display:none">
      <div class="pgt">已同步廠商資料</div>
      <div id="syncinfo-body" style="font-size:13px;color:var(--muted);line-height:1.9"></div>
    </div>
  </div>
</div>

<script>
var PROXY='https://notion-proxy.tca-hsuoo.workers.dev/notion';
var DBS={contact:'2199cedd371d801591ecf2849f459467',vendor:'2199cedd371d80fb8332c76b7b0e6916',todo:'2039cedd371d8010ae84f60c29f86990'};
var MS_OPTIONS=['法人','學','媒','官','地方政府','協力','百貨','電信','通訊'];
var vendorCache=null,todoResults=[],selectedTodos=[],contacts=[],queuedIds=[],batchVendorMap={};

window.onload=function(){
  var t=ls('notion_token'),k=ls('claude_key');
  var n=document.getElementById('ntoken'),c=document.getElementById('ckey');
  if(n&&t)n.value=t; if(c&&k)c.value=k;
  if(!t||!k)document.getElementById('setup-notice').style.display='block';
  var vc=ls('vendor_cache'); if(vc){vendorCache=JSON.parse(vc);showSyncInfo();}
  var today=new Date(); document.getElementById('meet-date').value=today.toISOString().substring(0,10);
};

function ls(k,v){if(v!==undefined){localStorage.setItem(k,v);return;}return localStorage.getItem(k);}
function gopage(p){document.getElementById('view-main').style.display=p==='main'?'block':'none';document.getElementById('view-settings').style.display=p==='settings'?'block':'none';}

function doParse(){
  var text=document.getElementById('card-input').value.trim();
  if(!text){alert('請先貼入名片文字');return;}
  var ckey=ls('claude_key'); if(!ckey){alert('請先在設定中填入 Claude API Key');return;}
  var btn=document.getElementById('btn-parse');
  btn.disabled=true; btn.innerHTML='<span class="sp"></span>解析中...';
  var dateVal=document.getElementById('meet-date').value;
  if(todoResults.length===0)fetchTodos(dateVal);
  document.getElementById('parse-status').innerHTML='<div class="smsg loading"><span class="sp" style="border-color:var(--muted);border-top-color:transparent"></span>解析中...</div>';
  var rawInput = text; // save original text before clearing
  parseCards(text,ckey)
    .then(function(parsed){
      document.getElementById('parse-status').innerHTML='';
      // split raw input by --- or double newline to map to each card
      var rawParts = rawInput.split(/\n---\n|\n\n\n/).map(function(s){return s.trim();}).filter(Boolean);
      parsed.forEach(function(c,i){
        c.id='c_'+Date.now()+'_'+Math.random().toString(36).substring(2,7);
        c.todoRel=selectedTodos.slice();
        c.rawText = rawParts[i] || rawInput; // fallback to full text if can't split
        contacts.push(c);
        appendContactBlock(c);
      });
      document.getElementById('card-input').value='';
    })
    .catch(function(e){document.getElementById('parse-status').innerHTML='<div class="smsg err">❌ 解析失敗：'+esc(e.message)+'</div>';})
    .finally(function(){btn.disabled=false;btn.textContent='🔍 解析並加入清單';});
}

function fetchTodos(dateStr){
  var token=ls('notion_token'); if(!token||!dateStr)return;
  document.getElementById('todo-card').style.display='block';
  document.getElementById('todo-status').textContent='查詢中...';
  var body={filter:{and:[{property:'DoOn',date:{equals:dateStr}},{or:[{property:'ToDo',rich_text:{contains:'會議'}},{property:'ToDo',rich_text:{contains:'meeting'}},{property:'ToDo',rich_text:{contains:'Meeting'}},{property:'ToDo',rich_text:{contains:'拜訪'}}]}]},page_size:50};
  fetch(PROXY+'/v1/databases/'+DBS.todo+'/query',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'Notion-Version':'2022-06-28'},body:JSON.stringify(body)})
  .then(function(r){return r.json();})
  .then(function(data){
    todoResults=(data.results||[]).map(function(p){var name='';if(p.properties['ToDo']&&p.properties['ToDo'].title)name=p.properties['ToDo'].title.map(function(t){return t.plain_text;}).join('');return{id:p.id,name:name};}).filter(function(t){return t.name;});
    document.getElementById('todo-status').textContent=todoResults.length>0?'找到 '+todoResults.length+' 筆，點選要關聯的：':'當天沒有找到會議相關 Todo';
    document.getElementById('todo-list').innerHTML=todoResults.map(function(t){return '<div class="todo-tag" id="gtag_'+safeId(t.id)+'" onclick="toggleTodo(\''+t.id+'\')">'+esc(t.name)+'</div>';}).join('');
  })
  .catch(function(){document.getElementById('todo-status').textContent='查詢失敗，請確認 Notion Token';});
}

function toggleTodo(id){
  var idx=selectedTodos.indexOf(id);
  if(idx>=0)selectedTodos.splice(idx,1); else selectedTodos.push(id);
  document.querySelectorAll('[id^="gtag_"]').forEach(function(el){el.classList.remove('sel');});
  selectedTodos.forEach(function(tid){var el=document.getElementById('gtag_'+safeId(tid));if(el)el.classList.add('sel');});
  contacts.forEach(function(c){if(queuedIds.indexOf(c.id)<0){c.todoRel=selectedTodos.slice();syncTodoRelUI(c.id);}});
}

function parseCards(text,ckey){
  var prompt='你是名片解析助手。請解析以下名片文字，多筆名片用---或空白行分隔。對每張名片，預判廠商類型（從以下選項選0~3個）：法人、學、媒、官、地方政府、協力、百貨、電信、通訊。\n\nphone 欄位規則：手機號碼優先（0開頭的10碼）；若無手機才填市話；若兩者都有，只填手機。\n\n回傳純 JSON 陣列，每筆格式：\n{"name":"姓名","title":"職稱","department":"部門","company":"公司名稱","email":"email","phone":"手機優先的電話號碼","multiSelect":["預判標籤"]}\n\n若無法解析某欄位請填空字串。名片文字：\n'+text;
  return fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':ckey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,messages:[{role:'user',content:prompt}]})})
  .then(function(res){if(!res.ok)return res.json().then(function(e){throw new Error(e.error&&e.error.message?e.error.message:'Claude API 錯誤');});return res.json();})
  .then(function(data){var raw=data.content[0].text.replace(/```json|```/g,'').trim();var parsed=JSON.parse(raw);if(!Array.isArray(parsed))parsed=[parsed];return parsed.map(function(c){return Object.assign({},c,{vendorMatch:matchVendor(c.company||'')});});});
}

function matchVendor(companyName){
  if(!companyName)return null;
  var name=companyName.trim().toLowerCase();
  if(batchVendorMap[name])return{status:'exists',id:batchVendorMap[name].id,name:batchVendorMap[name].name};
  if(!vendorCache||!vendorCache.length)return{status:'new',id:null,name:companyName};
  for(var i=0;i<vendorCache.length;i++){if(vendorCache[i].name.toLowerCase()===name)return{status:'exists',id:vendorCache[i].id,name:vendorCache[i].name};}
  var best=null,bestScore=0;
  for(var j=0;j<vendorCache.length;j++){var vn=vendorCache[j].name.toLowerCase();var score=0;if(vn.indexOf(name)>=0||name.indexOf(vn)>=0)score=2;else{var ov=0;for(var k=0;k<name.length;k++){if(vn.indexOf(name[k])>=0)ov++;}score=ov/Math.max(name.length,vn.length);}if(score>bestScore){bestScore=score;best=vendorCache[j];}}
  if(bestScore>=0.5&&best)return{status:'similar',id:best.id,name:best.name};
  return{status:'new',id:null,name:companyName};
}

function appendContactBlock(c){
  var area=document.getElementById('contacts-area');
  var div=document.createElement('div');
  div.className='cb'; div.id='cb_'+c.id;
  div.innerHTML=buildBlockHtml(c);
  area.appendChild(div);
}

function buildBlockHtml(c){
  var vm=c.vendorMatch,sb='';
  if(vm){if(vm.status==='exists')sb='<span class="vs-badge vs-exists">✅ 廠商已存在</span>';else if(vm.status==='similar')sb='<span class="vs-badge vs-similar">⚠️ 疑似相同</span>';else sb='<span class="vs-badge vs-new">➕ 新廠商</span>';}
  var mw=(vm&&vm.status==='similar')?'<div class="vmwarn">偵測到相似廠商：<b>'+esc(vm.name)+'</b>，請確認是否為同一廠商</div>':'';
  var ms=MS_OPTIONS.map(function(opt){var sel=(c.multiSelect||[]).indexOf(opt)>=0?' sel':'';return '<div class="ms-chip'+sel+'" id="ms_'+c.id+'_'+opt+'" onclick="toggleMs(\''+c.id+'\',\''+opt+'\')">'+opt+'</div>';}).join('');
  var tr=todoResults.length>0?'<div class="fl full"><div class="fl-lb">關聯 Todo</div><div class="todo-rel" id="trel_'+c.id+'">'+todoResults.map(function(t){var s=(c.todoRel||[]).indexOf(t.id)>=0?' sel':'';return '<div class="trc'+s+'" id="trc_'+c.id+'_'+safeId(t.id)+'" onclick="toggleTodoRel(\''+c.id+'\',\''+t.id+'\')">'+esc(t.name)+'</div>';}).join('')+'</div></div>':'';
  return '<div class="cb-hd" onclick="toggleBlock(\''+c.id+'\')">'
    +'<div><div class="cb-name">'+esc(c.name||'（未知）')+'</div><div class="cb-company">'+esc(c.company||'')+'</div></div>'
    +'<div class="cb-hd-right">'+sb+'<span id="carrow_'+c.id+'">▼</span></div></div>'
    +'<div class="cb-body open" id="cbbody_'+c.id+'">'
    +mw
    +'<div class="fields-grid">'
    +fld('姓名','fn_'+c.id,c.name||'')+fld('職稱','ft_'+c.id,c.title||'')
    +fld('部門','fd_'+c.id,c.department||'')+fld('Email','fe_'+c.id,c.email||'')
    +fld('電話','fp_'+c.id,c.phone||'')+fldFull('所屬廠商','fc_'+c.id,c.company||'')
    +'</div>'
    +'<div class="fl"><div class="fl-lb">廠商分類</div><div class="ms-wrap">'+ms+'</div></div>'
    +'<div style="height:10px"></div>'+tr
    +'<div class="cb-actions"><button class="badd" onclick="addToQueue(\''+c.id+'\')">✓ 加入清單</button></div>'
    +'<div id="cbst_'+c.id+'"></div></div>';
}

function fld(lb,id,val){return '<div class="fl"><div class="fl-lb">'+lb+'</div><input class="fv" id="'+id+'" type="text" value="'+esc(val)+'"></div>';}
function fldFull(lb,id,val){return '<div class="fl full"><div class="fl-lb">'+lb+'</div><input class="fv" id="'+id+'" type="text" value="'+esc(val)+'"></div>';}

function toggleBlock(cid){var body=document.getElementById('cbbody_'+cid),arrow=document.getElementById('carrow_'+cid);if(!body)return;if(body.classList.contains('open')){body.classList.remove('open');if(arrow)arrow.textContent='▶';}else{body.classList.add('open');if(arrow)arrow.textContent='▼';}}
function toggleMs(cid,opt){var c=contacts.filter(function(x){return x.id===cid;})[0];if(!c)return;if(!c.multiSelect)c.multiSelect=[];var idx=c.multiSelect.indexOf(opt),el=document.getElementById('ms_'+cid+'_'+opt);if(idx>=0){c.multiSelect.splice(idx,1);if(el)el.classList.remove('sel');}else{c.multiSelect.push(opt);if(el)el.classList.add('sel');}}
function toggleTodoRel(cid,tid){var c=contacts.filter(function(x){return x.id===cid;})[0];if(!c)return;if(!c.todoRel)c.todoRel=[];var idx=c.todoRel.indexOf(tid);if(idx>=0)c.todoRel.splice(idx,1);else c.todoRel.push(tid);syncTodoRelUI(cid);}
function syncTodoRelUI(cid){var c=contacts.filter(function(x){return x.id===cid;})[0];if(!c)return;todoResults.forEach(function(t){var chip=document.getElementById('trc_'+cid+'_'+safeId(t.id));if(!chip)return;chip.classList.toggle('sel',(c.todoRel||[]).indexOf(t.id)>=0);});}

function addToQueue(cid){
  var c=contacts.filter(function(x){return x.id===cid;})[0];if(!c)return;
  c.snapName=getVal('fn_'+cid);c.snapTitle=getVal('ft_'+cid);c.snapDept=getVal('fd_'+cid);
  c.snapEmail=getVal('fe_'+cid);c.snapPhone=getVal('fp_'+cid);c.snapCompany=getVal('fc_'+cid);
  if(queuedIds.indexOf(cid)<0)queuedIds.push(cid);
  var block=document.getElementById('cb_'+cid);
  if(block){
    block.classList.add('queued');
    var hdr=block.querySelector('.cb-hd-right');
    if(hdr)hdr.innerHTML='<span class="q-badge">✓ 已加入清單</span><button class="bcancel" onclick="event.stopPropagation();removeFromQueue(\''+cid+'\')">取消</button><span id="carrow_'+cid+'">▶</span>';
    var body=document.getElementById('cbbody_'+cid);if(body)body.classList.remove('open');
    var acts=block.querySelector('.cb-actions');if(acts)acts.style.display='none';
  }
  updateQueueBar();
}

function removeFromQueue(cid){
  var idx=queuedIds.indexOf(cid);if(idx>=0)queuedIds.splice(idx,1);
  var block=document.getElementById('cb_'+cid);
  if(block){block.classList.remove('queued');var c=contacts.filter(function(x){return x.id===cid;})[0];if(c)block.innerHTML=buildBlockHtml(c);}
  updateQueueBar();
}

function updateQueueBar(){
  var n=queuedIds.length,info=document.getElementById('queue-info'),btn=document.getElementById('btn-submit-all');
  if(n===0){info.innerHTML='尚無待寫入名片';btn.disabled=true;}
  else{info.innerHTML='已加入 <b>'+n+'</b> 筆，確認後送出';btn.disabled=false;}
}

function submitAll(){
  var token=ls('notion_token');if(!token){alert('請先設定 Notion Token');return;}
  if(queuedIds.length===0)return;
  var btn=document.getElementById('btn-submit-all');
  btn.disabled=true;btn.innerHTML='<span class="sp"></span>寫入中...';
  batchVendorMap={};
  var toWrite=queuedIds.slice(),done=0,failed=0;
  function next(i){
    if(i>=toWrite.length){
      btn.innerHTML='✅ 完成';
      document.getElementById('queue-info').innerHTML='已完成寫入 <b>'+done+'</b> 筆'+(failed>0?'，<span style="color:#a32d2d">'+failed+' 筆失敗</span>':'');
      queuedIds.length=0;return;
    }
    var cid=toWrite[i],c=contacts.filter(function(x){return x.id===cid;})[0];
    if(!c){next(i+1);return;}
    writeOne(token,c)
      .then(function(){done++;var block=document.getElementById('cb_'+cid);if(block){block.classList.remove('queued');block.classList.add('written');var hdr=block.querySelector('.cb-hd-right');if(hdr)hdr.innerHTML='<span class="w-badge">✅ 已寫入</span>';}next(i+1);})
      .catch(function(e){failed++;var st=document.getElementById('cbst_'+cid);if(st)st.innerHTML='<div class="smsg err" style="margin-top:8px">❌ '+esc(e.message)+'</div>';next(i+1);});
  }
  next(0);
}

function writeOne(token,c){
  var name=c.snapName||c.name||'',company=c.snapCompany||c.company||'',ms=c.multiSelect||[],todoRel=c.todoRel||[];
  return handleVendor(token,company,ms,c.vendorMatch)
    .then(function(vendorId){
      var props={'姓名':{title:[{text:{content:name}}]},'AI審核':{select:{name:'待確認'}}};
      var email=c.snapEmail||c.email||'',phone=c.snapPhone||c.phone||'',title=c.snapTitle||c.title||'',dept=c.snapDept||c.department||'';
      if(email)props['Email']={email:email};
      if(phone)props['Phone Number']={phone_number:phone};
      if(title)props['職稱']={rich_text:[{text:{content:title}}]};
      if(dept)props['部門']={rich_text:[{text:{content:dept}}]};
      if(vendorId)props['所屬廠商單位']={relation:[{id:vendorId}]};
      if(todoRel.length>0)props['關聯todo']={relation:todoRel.map(function(id){return{id:id};})};
      var rawText=c.rawText||[name,company,email,phone].filter(Boolean).join('\n');
      var children=[{object:'block',type:'heading_3',heading_3:{rich_text:[{text:{content:'名片原始資訊'}}]}},{object:'block',type:'code',code:{language:'plain text',rich_text:[{text:{content:rawText}}]}}];
      return fetch(PROXY+'/v1/pages',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'Notion-Version':'2022-06-28'},body:JSON.stringify({parent:{database_id:DBS.contact},properties:props,children:children})});
    })
    .then(function(res){if(!res.ok)return res.json().then(function(e){throw new Error(e.message||'寫入失敗');});return res.json();});
}

function handleVendor(token,companyName,ms,vendorMatch){
  if(!companyName)return Promise.resolve(null);
  var key=companyName.trim().toLowerCase();
  if(batchVendorMap[key])return Promise.resolve(batchVendorMap[key].id);
  if(vendorMatch&&vendorMatch.status==='exists'&&vendorMatch.id){batchVendorMap[key]={id:vendorMatch.id,name:vendorMatch.name};return Promise.resolve(vendorMatch.id);}
  if(vendorMatch&&vendorMatch.status==='similar'&&vendorMatch.id&&key===vendorMatch.name.toLowerCase()){batchVendorMap[key]={id:vendorMatch.id,name:vendorMatch.name};return Promise.resolve(vendorMatch.id);}
  var props={'公司名稱':{title:[{text:{content:companyName}}]}};
  if(ms&&ms.length>0)props['Multi-select']={multi_select:ms.map(function(m){return{name:m};})};
  return fetch(PROXY+'/v1/pages',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'Notion-Version':'2022-06-28'},body:JSON.stringify({parent:{database_id:DBS.vendor},properties:props})})
    .then(function(r){return r.json();})
    .then(function(data){var newId=data.id||null;batchVendorMap[key]={id:newId,name:companyName};return newId;});
}

function doSyncVendors(){
  var token=ls('notion_token');if(!token){alert('請先儲存 Notion Token');return;}
  var btn=document.querySelector('.bsync'),st=document.getElementById('syncst');
  btn.textContent='⏳ 同步中...';btn.disabled=true;st.textContent='正在讀取廠商資料庫...';
  var results=[];
  function go(cursor){var body={page_size:100};if(cursor)body.start_cursor=cursor;return fetch(PROXY+'/v1/databases/'+DBS.vendor+'/query',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'Notion-Version':'2022-06-28'},body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(data){(data.results||[]).forEach(function(p){var name='';if(p.properties['公司名稱']&&p.properties['公司名稱'].title)name=p.properties['公司名稱'].title.map(function(t){return t.plain_text;}).join('');if(name.trim())results.push({id:p.id,name:name.trim()});});if(data.has_more&&data.next_cursor)return go(data.next_cursor);});}
  go(null).then(function(){vendorCache=results;ls('vendor_cache',JSON.stringify(results));st.textContent='✅ 同步完成：'+results.length+' 家廠商';showSyncInfo();}).catch(function(e){st.textContent='❌ 同步失敗：'+e.message;}).finally(function(){btn.textContent='🔄 同步廠商資料庫';btn.disabled=false;});
}

function showSyncInfo(){if(!vendorCache)return;document.getElementById('syncinfo').style.display='block';document.getElementById('syncinfo-body').innerHTML='廠商數量：'+vendorCache.length+' 家';}
function saveCfg(){var t=document.getElementById('ntoken').value.trim(),k=document.getElementById('ckey').value.trim();if(!t||!k){alert('請填入兩個 Token');return;}ls('notion_token',t);ls('claude_key',k);document.getElementById('setup-notice').style.display='none';alert('✅ 已儲存！請點「同步廠商資料庫」');gopage('main');}
function getVal(id){var el=document.getElementById(id);return el?el.value.trim():'';}
function safeId(s){return String(s).replace(/[^a-z0-9]/g,'');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>
</body>
